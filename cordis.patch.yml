# The layer this bundle contributes when a profile lists it. Config is
# omitted so the plugin's schema defaults apply (the generation follows the
# session's current model). Override this row by id in your profile's
# cordis.patch.yml to pin a model or change bounds:
#
#   - id: genui
#     name: @valuz/dsh-valuz-genui
#     config:
#       provider: deepseek-official
#       model: deepseek-v4-flash
- insert:
    - id: genui
      name: @valuz/dsh-valuz-genui
